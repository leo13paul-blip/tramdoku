<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tramdoku - Grenoble</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Tramdoku Grenoble</h1>
        <p>Complétez la grille 2x2 avec les stations du réseau M TAG.</p>
        <p id="compteur-erreurs">Erreurs : 0 / 3</p>
    </header>

    <main>
        <div class="grid-container" id="game-grid">
            <!-- Ligne des en-têtes (Colonnes) -->
            <div class="header-cell empty"></div>
            <div class="header-cell col-header" id="cat-col-0">Col 1</div>
            <div class="header-cell col-header" id="cat-col-1">Col 2</div>

            <!-- Ligne 1 -->
            <div class="header-cell row-header" id="cat-row-0">Ligne 1</div>
            <div class="game-cell" data-row="0" data-col="0"></div>
            <div class="game-cell" data-row="0" data-col="1"></div>

            <!-- Ligne 2 -->
            <div class="header-cell row-header" id="cat-row-1">Ligne 2</div>
            <div class="game-cell" data-row="1" data-col="0"></div>
            <div class="game-cell" data-row="1" data-col="1"></div>
        </div>

        <!-- Boutons d'action (Abandonner / Rejouer) -->
        <div class="actions-container">
            <button id="btn-abandon" class="btn-action">Abandonner</button>
            <button id="btn-rejouer" class="btn-action hidden">Nouvelle Grille</button>
        </div>
    </main>

    <!-- La fenêtre de recherche / solutions (Modale) -->
    <div id="search-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2 id="modal-title">Trouver une station</h2>
            <p id="modal-instructions">Intersection : <span id="current-intersection"></span></p>
            <p id="hint-possibilites"></p>
            
            <div class="search-container">
                <input type="text" id="station-input" placeholder="Tapez le nom d'une station..." autocomplete="off">
                <ul id="suggestions-list"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
